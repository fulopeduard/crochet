<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuki Horgolós Prompt Másoló 🧶</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #fce4ec;
            background-image: radial-gradient(#f8bbd0 2px, transparent 2px);
            background-size: 30px 30px;
            font-family: 'Nunito', sans-serif;
            color: #5d4037;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Lebegő amigurumi figurák */
        .floating-figures {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            font-size: 3rem;
            margin-bottom: 20px;
            z-index: 10;
        }

        .figure {
            animation: bounce 2.5s ease-in-out infinite alternate;
        }

        .fig-1 { animation-delay: 0s; }
        .fig-2 { animation-delay: 0.8s; font-size: 3.5rem; }
        .fig-3 { animation-delay: 0.4s; }

        @keyframes bounce {
            0% { transform: translateY(0px) rotate(-5deg); }
            100% { transform: translateY(-20px) rotate(5deg); }
        }

        /* Fő tartalom kártya */
        .card {
            background: #ffffff;
            padding: 30px 20px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(244, 143, 177, 0.3);
            text-align: center;
            width: 90%;
            max-width: 450px;
            z-index: 10;
            border: 4px dashed #ffcdd2;
            position: relative;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 900;
            color: #d81b60;
            margin-bottom: 20px;
        }

        /* Animált fonal és tű SVG */
        .yarn-animation {
            height: 80px;
            width: 100%;
            margin-bottom: 15px;
            position: relative;
        }

        .yarn-path {
            fill: none;
            stroke: #ff8a80;
            stroke-width: 4;
            stroke-linecap: round;
            stroke-dasharray: 200;
            stroke-dashoffset: 200;
            animation: drawYarn 3s linear infinite;
        }

        @keyframes drawYarn {
            0% { stroke-dashoffset: 200; }
            50% { stroke-dashoffset: 0; }
            100% { stroke-dashoffset: -200; }
        }

        .hook {
            position: absolute;
            font-size: 2rem;
            top: 25px;
            left: 50%;
            animation: crochetMotion 1.5s ease-in-out infinite;
        }

        @keyframes crochetMotion {
            0% { transform: translate(30px, 0px) rotate(-20deg); }
            50% { transform: translate(50px, -15px) rotate(10deg); }
            100% { transform: translate(30px, 0px) rotate(-20deg); }
        }

        /* Űrlap elemek */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input {
            padding: 15px 20px;
            border-radius: 20px;
            border: 2px solid #f8bbd0;
            background: #fffafa;
            font-size: 1rem;
            font-family: 'Nunito', sans-serif;
            color: #5d4037;
            outline: none;
            transition: 0.3s;
            text-align: center;
            width: 100%;
        }

        input:focus {
            border-color: #f48fb1;
            box-shadow: 0 0 10px rgba(244, 143, 177, 0.4);
        }

        button {
            background: linear-gradient(135deg, #b3e5fc, #81d4fa);
            border: none;
            padding: 16px;
            border-radius: 20px;
            color: #01579b;
            font-weight: 900;
            font-size: 1.2rem;
            font-family: 'Nunito', sans-serif;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 15px rgba(129, 212, 250, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(129, 212, 250, 0.6);
        }

        button:active {
            transform: translateY(1px);
        }

        /* Toast értesítés */
        .toast {
            position: fixed;
            bottom: -80px;
            background: #a5d6a7;
            color: #1b5e20;
            padding: 15px 30px;
            border-radius: 30px;
            font-weight: 700;
            box-shadow: 0 5px 15px rgba(165, 214, 167, 0.5);
            transition: bottom 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 100;
        }

        .toast.show {
            bottom: 40px;
        }

        /* Felhők a háttérben */
        .cloud {
            position: absolute;
            background: white;
            border-radius: 50px;
            opacity: 0.6;
            z-index: 1;
            animation: floatClouds 20s linear infinite;
        }
        
        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: white;
            border-radius: 50%;
        }

        .c1 { width: 100px; height: 30px; top: 15%; left: -120px; }
        .c1::before { width: 50px; height: 50px; top: -25px; left: 15px; }
        .c1::after { width: 40px; height: 40px; top: -15px; left: 55px; }

        .c2 { width: 80px; height: 25px; top: 75%; left: -100px; animation-duration: 25s; animation-delay: 5s; }
        .c2::before { width: 40px; height: 40px; top: -20px; left: 10px; }
        .c2::after { width: 30px; height: 30px; top: -10px; left: 40px; }

        @keyframes floatClouds {
            0% { transform: translateX(0); }
            100% { transform: translateX(120vw); }
        }
    </style>
</head>
<body>

    <!-- Háttér felhők -->
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>

    <!-- Lebegő Figurák -->
    <div class="floating-figures">
        <div class="figure fig-1">🐰</div>
        <div class="figure fig-2">🧶</div>
        <div class="figure fig-3">🐢</div>
    </div>

    <!-- Fő kártya -->
    <div class="card">
        <h1>Varázslatos Prompt Készítő ✨</h1>
        
        <!-- Animált horgolás -->
        <div class="yarn-animation">
            <svg width="150" height="60" viewBox="0 0 150 60">
                <path class="yarn-path" d="M10,40 Q40,10 70,40 T130,40" />
            </svg>
            <div class="hook">🪄</div>
        </div>

        <div class="input-group">
            <input type="text" id="ytLink" placeholder="Ide illeszd a YouTube linket... 🎀">
            <button onclick="copyPrompt()">
                Készíts & Másolj 📋
            </button>
        </div>
    </div>

    <!-- Siker üzenet -->
    <div class="toast" id="toastMessage">💖 Sikeresen kimásolva! 💖</div>

    <script>
        function copyPrompt() {
            const ytInput = document.getElementById('ytLink').value.trim();
            const linkToUse = ytInput !== "" ? ytInput : "[PASTE YOUTUBE VIDEO LINK HERE]";

            const promptText = `${linkToUse}

Watch this YouTube crochet tutorial and extract the complete crochet pattern step-by-step.

Pattern requirements:
• Use standard English crochet terminology/abbreviations + full Hungarian translation.
• Keep the original project structure/order from the video.
• Organize by sections/parts.
• Number every row/round and include stitch counts when possible.
• Include materials, color changes, stuffing, sewing/assembly, repeats, notes, warnings, and special instructions.
• Place every instruction directly beside the relevant row/round/section — never collect notes only at the end.
• Make the pattern fully usable without watching the video again.
• If something is unclear, estimate it and mark it clearly as estimated.
• Do not summarize; extract the full detailed pattern.

Create a single-file HTML webpage (HTML/CSS/JS only) for tracking crochet progress.

Webpage requirements:
• Default language: English.
• Add instant EN/HU switch for the full UI + pattern.
• Both languages must work offline inside the same HTML file.
• Cute/cozy aesthetic matching the crochet project.
• Mobile-friendly and responsive.
• Every row/round must have:
  • Checkbox (Checkbox should visually represent the crochet project using an emoji that matches the item being made (instead of a standard checkbox icon)
  Example:
    • Turtle project → 🐢
    • Bunny project → 🐰
    • Cat project → 🐱
  • Row/round number
  • Instructions
  • Stitch count
• Save progress with localStorage.
• Keep checkbox progress synchronized between EN/HU modes.
• Add:
  • Progress bar
  • "Mark all complete" button
  • "Reset progress" button
• Layout should be compact, clean, practical, and comfortable during real crocheting but also very cute design with pastel colors.

Abbreviation system:
• EVERY crochet abbreviation used anywhere (SC, INC, DEC, SL ST, MR, FLO, BLO, HDC, DC, TR, CH, FO, etc.) must be clickable/hoverable everywhere it appears, including checklist rows, notes, repeats, and section titles.
• On click/hover show:
  • Abbreviation
  • Full English meaning
  • Hungarian crochet term
  • Simple Hungarian beginner-friendly explanation
• Example:
  • SC → Single Crochet → Rövidpálca → „Alap öltés, ahol egyszer húzod át a fonalat.”
• Tooltip/popup system must work well on desktop and mobile.
• Interactive abbreviations must stay inline naturally and should not unnecessarily break rows or increase row height.

LANGUAGE SYSTEM:
• The webpage must support 3 language modes:
  • Default
  • EN
  • HU
• Default mode behavior:
  • Crochet pattern instructions stay in English crochet terminology
  • UI labels, helper text, buttons, and explanations appear in Hungarian
• EN mode:
  • Everything fully in English
• HU mode:
  • Everything fully translated into Hungarian
• Switching languages must happen instantly without page reload.
• Both language versions must be fully generated and available offline inside the same HTML file.
• Checkbox progress must stay synchronized between all language modes.`;

            // Másolás a vágólapra
            navigator.clipboard.writeText(promptText).then(() => {
                showToast();
            }).catch(err => {
                console.error('Nem sikerült másolni: ', err);
                alert("Kérlek, engedélyezd a vágólaphoz való hozzáférést!");
            });
        }

        // Toast értesítés megjelenítése
        function showToast() {
            const toast = document.getElementById("toastMessage");
            toast.classList.add("show");
            
            // 3 másodperc után eltűnik
            setTimeout(() => {
                toast.classList.remove("show");
            }, 3000);
        }
    </script>
</body>
</html>
